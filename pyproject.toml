[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drscreen"
version = "0.1.0"
description = "Diabetic retinopathy screening prototype: quality gate, DR grading, Grad-CAM and risk triage."
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies only, with compatible ranges. Exact pins for every
# transitive package live in requirements.txt / requirements-dev.txt,
# regenerated with `make lock`.
dependencies = [
    "kagglehub>=1.0,<2",
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "opencv-python-headless>=5.0,<6",
    "pandas>=3.0,<4",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.34,<3",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.15,<3",
    "mypy>=2.3,<3",
    "pandas-stubs>=3.0",
    "pip-tools>=7.6,<8",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "types-PyYAML>=6.0",
    "types-requests>=2.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "D",       # pydocstyle
    "T20",     # print statements
    "TID",     # tidy imports (bans relative imports)
    "PTH",     # pathlib over os.path
    "BLE",     # blind except
    "PL",      # pylint subset, includes magic-value comparisons
    "RUF",
]
ignore = [
    "PLR0913",  # argument counts are governed by config objects, not this rule
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]  # test names document intent; literals are expected values
"scripts/**" = ["T20"]         # CLI entry points may print

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# These packages ship without type information.
module = ["kagglehub.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Module boundaries from ARCHITECTURE.md, enforced by `make lint`.
# Contracts are added as the modules they constrain are built.
[tool.importlinter]
root_package = "drscreen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Preprocessing is pure array code shared by training and serving"
type = "forbidden"
source_modules = ["drscreen.data.preprocessing"]
forbidden_modules = ["torch", "pandas", "drscreen.data.fetch", "drscreen.data.sources"]
