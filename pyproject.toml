[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drscreen"
version = "0.1.0"
description = "Diabetic retinopathy screening prototype: quality gate, DR grading, Grad-CAM and risk triage."
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies only, with compatible ranges. Exact pins for every
# transitive package live in requirements.txt / requirements-dev.txt,
# regenerated with `make lock`.
dependencies = [
    "gradio>=6.30,<7",
    "huggingface-hub>=2.1,<3",
    "kagglehub>=1.0,<2",
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "opencv-python-headless>=5.0,<6",
    "pandas>=3.0,<4",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.34,<3",
    "scikit-learn>=1.9,<2",
    "timm>=1.0,<2",
    "torch>=2.14,<3",
    "torchvision>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.15,<3",
    "mypy>=2.3,<3",
    "pandas-stubs>=3.0",
    "pip-tools>=7.6,<8",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "types-PyYAML>=6.0",
    "types-requests>=2.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drscreen = ["app/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "D",       # pydocstyle
    "T20",     # print statements
    "TID",     # tidy imports (bans relative imports)
    "PTH",     # pathlib over os.path
    "BLE",     # blind except
    "PL",      # pylint subset, includes magic-value comparisons
    "RUF",
]
ignore = [
    "PLR0913",  # argument counts are governed by config objects, not this rule
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]  # test names document intent; literals are expected values
"scripts/**" = ["T20"]         # CLI entry points may print
"notebooks/**" = ["T20"]       # notebooks are interactive entry points

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# These packages ship without type information.
module = ["kagglehub.*", "sklearn.*", "timm.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Module boundaries from ARCHITECTURE.md, enforced by `make lint`.
# Contracts are added as the modules they constrain are built.
[tool.importlinter]
root_package = "drscreen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Preprocessing is pure array code shared by training and serving"
type = "forbidden"
source_modules = ["drscreen.data.preprocessing"]
forbidden_modules = ["torch", "pandas", "drscreen.data.fetch", "drscreen.data.sources"]

[[tool.importlinter.contracts]]
name = "Data pipeline does not depend on models, training or evaluation"
type = "forbidden"
source_modules = ["drscreen.data"]
forbidden_modules = ["drscreen.models", "drscreen.training", "drscreen.evaluation"]

[[tool.importlinter.contracts]]
name = "Models depend only on preprocessing and tensor conversion from the data package"
type = "forbidden"
source_modules = ["drscreen.models"]
forbidden_modules = [
    "drscreen.training",
    "drscreen.evaluation",
    "drscreen.data.augmentation",
    "drscreen.data.dataset",
    "drscreen.data.fetch",
    "drscreen.data.prepare",
    "drscreen.data.sources",
]

[[tool.importlinter.contracts]]
name = "Evaluation does not depend on training"
type = "forbidden"
source_modules = ["drscreen.evaluation"]
forbidden_modules = ["drscreen.training"]

[[tool.importlinter.contracts]]
name = "Grad-CAM is standalone and knows nothing about DR"
type = "forbidden"
source_modules = ["drscreen.explain"]
forbidden_modules = [
    "drscreen.app",
    "drscreen.config",
    "drscreen.data",
    "drscreen.evaluation",
    "drscreen.inference",
    "drscreen.models",
    "drscreen.risk",
    "drscreen.training",
]

[[tool.importlinter.contracts]]
name = "Inference serves from checkpoints without training, evaluation or dataset tooling"
type = "forbidden"
source_modules = ["drscreen.inference"]
forbidden_modules = [
    "pandas",
    "drscreen.app",
    "drscreen.risk",
    "drscreen.training",
    "drscreen.evaluation",
    "drscreen.data.augmentation",
    "drscreen.data.dataset",
    "drscreen.data.fetch",
    "drscreen.data.prepare",
    "drscreen.data.sources",
]

[[tool.importlinter.contracts]]
name = "Risk calculator is pure logic, independent of anything with weights"
type = "forbidden"
source_modules = ["drscreen.risk"]
forbidden_modules = [
    "torch",
    "drscreen.app",
    "drscreen.data",
    "drscreen.evaluation",
    "drscreen.explain",
    "drscreen.inference",
    "drscreen.models",
    "drscreen.training",
]

[[tool.importlinter.contracts]]
name = "App contains no model logic: it calls inference and risk only"
type = "forbidden"
source_modules = ["drscreen.app"]
forbidden_modules = [
    "torch",
    "drscreen.data",
    "drscreen.evaluation",
    "drscreen.explain",
    "drscreen.models",
    "drscreen.training",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Nothing below the app imports it"
type = "forbidden"
source_modules = [
    "drscreen.data",
    "drscreen.evaluation",
    "drscreen.explain",
    "drscreen.inference",
    "drscreen.models",
    "drscreen.risk",
    "drscreen.training",
]
forbidden_modules = ["drscreen.app", "gradio"]
