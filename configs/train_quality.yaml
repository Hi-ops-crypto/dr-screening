# Image quality model training. Schema: drscreen.training.settings.TrainingRunConfig.
# Three classes (Good / Usable / Reject) from EyeQ labels on EyePACS images.
# Inputs are raw 224 px crops without lighting normalisation (see
# preprocessing.quality in configs/data.yaml), so exposure and blur stay visible.

data_config: configs/data.yaml
sources: [eyeq]
runs_dir: runs
init_checkpoint: null   # train from the backbone's pretrained weights

model:
  # MobileNetV3-Large (5.5M parameters) at 224 px runs in tens of milliseconds
  # on a CPU, so the gate adds little latency in front of the grading model.
  backbone: mobilenetv3_large_100
  pretrained: true       # ImageNet weights, downloaded by timm on first use
  weights_path: null
  drop_rate: 0.2

augmentation:
  # Geometric only. Blur, exposure, colour and vignetting are what the labels
  # describe: adding them to a "Good" image would make its label wrong.
  crop_scale: {min: 0.9, max: 1.0}
  rotation_degrees: 20
  flip_probability: 0.5
  brightness: 0.0
  contrast: 0.0
  saturation: 0.0
  hue: 0.0
  blur_probability: 0.0
  blur_sigma: {min: 0.1, max: 0.1}
  vignette_probability: 0.0
  vignette_strength: {min: 0.0, max: 0.0}

optimisation:
  epochs: 10
  batch_size: 64
  learning_rate: 3.0e-4  # AdamW, cosine-decayed to zero over the run
  weight_decay: 1.0e-4
  class_weight_power: 1.0  # full inverse-frequency weighting; Reject is the rare class
  early_stopping_patience: 3
  num_workers: 4         # Kaggle notebooks have 4 CPU cores
  mixed_precision: true  # float16 on CUDA only; ignored elsewhere
  device: auto
  seed: 42
  deterministic: false

# Quality has no referral decision. Labels are ordinal (Good < Usable <
# Reject), so the best checkpoint is still chosen by quadratic weighted kappa.
referable_min_grade: null
