# DR grading model training. Schema: drscreen.training.settings.TrainingRunConfig.
# Sized for one Kaggle T4 session: about 41k training images, roughly 40 minutes
# per epoch (image loading on 4 CPUs is the bottleneck), so 8 epochs take about
# 5.5 hours (the session limit is 12).

data_config: configs/data.yaml
# Four populations (India, the US, China) and many camera models generalise
# better than any one. IDRiD stays out: it is the external test set.
sources: [aptos, eyepacs, eyepacs_test, ddr]
runs_dir: runs
init_checkpoint: null   # train from the backbone's pretrained weights

model:
  # Any timm model name. EfficientNet-B3 (10.7M parameters) learned more than
  # B0 (5.3M) in the same time: training is limited by image loading on
  # Kaggle's 4 CPUs, not by the GPU. To try RETFound: backbone vit_large_patch16_224, pretrained false,
  # weights_path pointing at its checkpoint, and matching image_size.
  backbone: efficientnet_b3
  pretrained: true       # ImageNet weights, downloaded by timm on first use
  weights_path: null
  drop_rate: 0.3         # dropout before the classifier head

augmentation:
  # Framing: the phone may not be centred or at a fixed distance.
  crop_scale: {min: 0.8, max: 1.0}
  rotation_degrees: 20
  # Left and right eyes are mirror images, so flipping yields realistic images.
  flip_probability: 0.5
  # Exposure and white balance: phone auto-exposure and LED illumination.
  brightness: 0.3
  contrast: 0.3
  saturation: 0.2
  hue: 0.03
  # Focus: hand-held capture without a chin rest.
  blur_probability: 0.3
  blur_sigma: {min: 0.5, max: 2.5}
  # Clip-on lens optics darken the periphery.
  vignette_probability: 0.4
  vignette_strength: {min: 0.2, max: 0.6}

optimisation:
  epochs: 8              # 2.5x the data per epoch; earlier runs peaked by epoch 7-9
  batch_size: 16         # B3 at 512 px with mixed precision within 16 GB
  learning_rate: 3.0e-4  # AdamW, cosine-decayed to zero over the run
  weight_decay: 1.0e-4
  # Square root of inverse-frequency weights. Full weighting (1.0) made the
  # first models call many healthy eyes grade 1; referral sensitivity is
  # restored afterwards by the tuned threshold.
  class_weight_power: 0.5
  early_stopping_patience: 3
  num_workers: 4         # Kaggle notebooks have 4 CPU cores
  mixed_precision: true  # float16 on CUDA only; ignored elsewhere
  device: auto
  seed: 42
  deterministic: false   # true makes runs bit-identical but roughly 10-20% slower

# Moderate NPDR or worse is "referable DR", the threshold used by screening
# programmes and by Gulshan et al., JAMA 2016;316(22):2402-10.
referable_min_grade: 2
