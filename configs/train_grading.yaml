# DR grading model training. Schema: drscreen.training.settings.TrainingRunConfig.
# Sized for one Kaggle T4/P100 GPU session; a run takes well under an hour.

data_config: configs/data.yaml
source: aptos            # IDRiD is rejected here: it is the external test set
runs_dir: runs

model:
  # Any timm model name. EfficientNet-B0 (5.3M parameters) fits free GPUs at
  # 512 px. To try RETFound: backbone vit_large_patch16_224, pretrained false,
  # weights_path pointing at its checkpoint, and matching image_size.
  backbone: efficientnet_b0
  pretrained: true       # ImageNet weights, downloaded by timm on first use
  weights_path: null
  drop_rate: 0.3         # dropout before the classifier head

augmentation:
  # Framing: the phone may not be centred or at a fixed distance.
  crop_scale: {min: 0.8, max: 1.0}
  rotation_degrees: 20
  # Left and right eyes are mirror images, so flipping yields realistic images.
  flip_probability: 0.5
  # Exposure and white balance: phone auto-exposure and LED illumination.
  brightness: 0.3
  contrast: 0.3
  saturation: 0.2
  hue: 0.03
  # Focus: hand-held capture without a chin rest.
  blur_probability: 0.3
  blur_sigma: {min: 0.5, max: 2.5}
  # Clip-on lens optics darken the periphery.
  vignette_probability: 0.4
  vignette_strength: {min: 0.2, max: 0.6}

optimisation:
  epochs: 20
  batch_size: 24         # fits 16 GB of GPU memory at 512 px with mixed precision
  learning_rate: 3.0e-4  # AdamW, cosine-decayed to zero over the run
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  num_workers: 4         # Kaggle notebooks have 4 CPU cores
  mixed_precision: true  # float16 on CUDA only; ignored elsewhere
  device: auto
  seed: 42
  deterministic: false   # true makes runs bit-identical but roughly 10-20% slower

# Moderate NPDR or worse is "referable DR", the threshold used by screening
# programmes and by Gulshan et al., JAMA 2016;316(22):2402-10.
referable_min_grade: 2
